name: CI

# Fast feedback on every push and PR: Python tests, the ADR-010 guard, and a
# real frontend build. Deliberately does NOT run the scrapers — Basketball-
# Reference rate-limits at 20 req/min and has banned this project's IP before,
# so hitting it on every push would be both slow and hostile. The nightly
# workflow owns all network access.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: ETL tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        # Includes the ADR-010 guard (tests/test_adr010.py), which parses the
        # AST of every etl/ module rather than grepping for the forbidden
        # import. A text search cannot tell an import from a docstring that
        # documents the prohibition, and fired on our own documentation.
        run: python -m pytest tests/ -q

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --prefix web

      - name: Build
        # `prebuild` stages data/processed into web/public/data, so this also
        # proves the committed dataset is present and well-formed.
        run: npm run build --prefix web

      - name: Verify the built site shipped real data
        run: |
          # A green build that shipped mock data is worse than a red one,
          # because it looks correct.
          test -f web/dist/data/players.json || {
            echo "::error::players.json missing from dist"; exit 1; }
          if grep -q '"is_mock": *true' web/dist/data/meta.json 2>/dev/null; then
            echo "::error::built site contains MOCK data"
            exit 1
          fi
          # Band matches _verify() in etl/build.py — keep the two in step.
          python3 -c "
          import json,sys
          p=json.load(open('web/dist/data/players.json'))
          print(f'shipped {len(p)} players')
          sys.exit(0 if 250 <= len(p) <= 600 else 1)
          "
          echo "headshots staged: $(ls web/dist/data/headshots 2>/dev/null | wc -l)"
